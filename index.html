<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><meta name="description" content="BASI AI - your personal AI assistant">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
<title>BASI AI</title>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">✦</div><div><strong>BASI AI</strong><small>Your AI. Your World.</small></div></div>
    <button class="new-chat" id="newChat">＋ New chat</button>
    <div class="side-label">START HERE</div>
    <div class="hint">Ask a question, brainstorm an idea, or get help with writing.</div>
    <div class="side-bottom">Starter version · Dark mode</div>
  </aside>
  <main class="main">
    <header><button class="mobile-brand" id="menuBtn" aria-label="Menu">☰</button><div class="top-title">BASI AI <span class="pill">DEMO</span></div><button id="clearBtn" class="clear-btn">Clear chat</button></header>
    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div><h1>What can I help with?</h1>
        <p>Your personal AI assistant starts here.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Explain artificial intelligence in simple words">✧ Explain AI simply</button>
          <button class="suggestion" data-prompt="Give me five creative app ideas">✧ Brainstorm ideas</button>
          <button class="suggestion" data-prompt="Help me write a short introduction about myself">✧ Help me write</button>
          <button class="suggestion" data-prompt="Teach me a useful fact in Malayalam">✧ Learn something</button>
        </div>
      </div>
    </section>
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Message BASI AI..." aria-label="Message BASI AI"></textarea>
      <button class="send" type="submit" aria-label="Send message">↑</button>
      <div class="composer-note">Demo mode: replies are local examples, not live AI responses.</div>
    </form>
  </main>
</div>
<script src="app.js"></script>
</body></html>
